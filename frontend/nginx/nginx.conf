# Production nginx for the Tasks UI (image: nginx-unprivileged, runs as uid 101, port 8080).
# - serves the React build, with SPA fallback
# - proxies ONLY /api/v1/ to the FastAPI backend over the `proxy` network
# - writes JSON access logs without query strings to stdout
# Everything writable lives in /tmp (tmpfs), so the root filesystem can be read-only.

worker_processes auto;
# Graceful shutdown: on SIGQUIT workers finish in-flight requests, but never longer than this.
worker_shutdown_timeout 20s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ---- request limits ---------------------------------------------------------------
    # Largest legitimate body is a task: title (200) + description (5000 chars) in JSON.
    client_max_body_size      64k;
    client_body_buffer_size   16k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_header_timeout     10s;
    client_body_timeout       10s;
    send_timeout              15s;

    # ---- logging: never log query strings --------------------------------------------
    # $request and $request_uri contain the query string, so the log uses the path only.
    # $http_referer is omitted for the same reason.
    map $request_uri $log_path {
        "~^(?<path>[^?]*)" $path;
        default            "-";
    }
    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
        '"method":"$request_method","path":"$log_path","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. The backend name is resolved at request time (see the
    # variable in proxy_pass), so nginx starts even if the backend is not up yet and
    # follows the backend if its IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include snippets/security-headers.conf;

        # ---- API reverse proxy: only /api/v1/* reaches the backend ----------------------
        # /health, /ready, /metrics and the OpenAPI docs are NOT proxied.
        location ^~ /api/v1/ {
            limit_except GET POST PUT PATCH DELETE { deny all; }

            set $backend_upstream "backend:8000";
            proxy_pass http://$backend_upstream;   # no URI part: the request URI is passed unchanged

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;          # correlates nginx and backend logs
            proxy_set_header X-Forwarded-For $remote_addr;      # replaces, never appends client-supplied values
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;                             # never replay a write

            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;

            add_header Cache-Control "no-store" always;
            include snippets/security-headers.conf;

            # Only for failures nginx itself detects (backend down/timeout). The backend's own
            # error responses (422, 404, 503 database_unavailable) pass through untouched.
            error_page 502 503 504 = @api_unavailable;
        }

        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            include snippets/security-headers.conf;
            return 503 '{"error":{"code":"upstream_unavailable","message":"Backend temporarily unavailable"}}';
        }

        # Any other /api/ path is unknown.
        location ^~ /api/ {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            include snippets/security-headers.conf;
            return 404 '{"error":{"code":"not_found","message":"Not Found"}}';
        }

        # ---- static files ---------------------------------------------------------------
        location ~ /\. {
            return 404;
        }

        # Vite emits content-hashed files under /assets/: safe to cache forever.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include snippets/security-headers.conf;
        }

        # A path with a file extension that does not exist is a real 404, not the SPA.
        location ~* \.[a-z0-9]+$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            include snippets/security-headers.conf;
        }

        # SPA fallback: every other path serves index.html (never cached, so deploys show at once).
        location / {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            include snippets/security-headers.conf;
        }
    }
}
