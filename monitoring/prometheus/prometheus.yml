# Prometheus configuration (Phase 5).
# Scrape traffic runs over the internal `metrics` network (backend, exporters) and the
# internal `monitoring` network (Loki and Alloy, added in Phase 7).
# Alerting is done by Grafana Alerting (Phase 8), so there is no alertmanager section here.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

# Night Watch: alert rules (rules/alerts.yml) are routed through Alertmanager over `monitoring`.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Phase 7: the logging stack, over the `monitoring` network.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Night Watch: frontend availability. Prometheus asks Blackbox Exporter (on `metrics`) to probe nginx.
  - job_name: frontend-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx:8080/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
