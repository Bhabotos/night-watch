# Unit tests for monitoring/prometheus/rules/recording.yml
# Run: see tests/e2e/check_phase5.sh (promtool test rules).
rule_files:
  - ../../monitoring/prometheus/rules/recording.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      # 10 requests/minute of 200, 2 requests/minute of 500 -> error ratio 2/12
      - series: 'http_requests_total{job="backend",method="GET",path="/x",status="200"}'
        values: "0+2.5x40"
      - series: 'http_requests_total{job="backend",method="GET",path="/x",status="500"}'
        values: "0+0.5x40"
    promql_expr_test:
      # round() keeps the comparison independent of floating-point noise
      - expr: round(app:http_requests:rate5m, 0.001)
        eval_time: 5m
        exp_samples:
          - value: 0.2
      - expr: round(app:http_errors:ratio_rate5m, 0.001)
        eval_time: 5m
        exp_samples:
          - value: 0.167

  - interval: 15s
    # Healthy traffic and no 5xx series at all: the ratio must be 0, not absent.
    input_series:
      - series: 'http_requests_total{job="backend",method="GET",path="/x",status="200"}'
        values: "0+1x40"
    promql_expr_test:
      - expr: app:http_errors:ratio_rate5m
        eval_time: 5m
        exp_samples:
          - labels: "app:http_errors:ratio_rate5m"
            value: 0

  - interval: 15s
    # No traffic at all: the ratio is 0, not NaN or absent.
    input_series:
      - series: 'http_requests_total{job="backend",method="GET",path="/x",status="200"}'
        values: "5x40"
    promql_expr_test:
      - expr: app:http_errors:ratio_rate5m
        eval_time: 5m
        exp_samples:
          - labels: "app:http_errors:ratio_rate5m"
            value: 0

  - interval: 15s
    # 2 cores; core0 burns 0.2 CPU-seconds/second (user), core1 is idle -> utilisation 0.1.
    # The idle counters deliberately under-tick (WSL2 quirk): the result must not depend on them.
    input_series:
      - series: 'node_cpu_seconds_total{job="node",instance="n1",cpu="0",mode="user"}'
        values: "0+3x20"
      - series: 'node_cpu_seconds_total{job="node",instance="n1",cpu="0",mode="idle"}'
        values: "0+1x20"
      - series: 'node_cpu_seconds_total{job="node",instance="n1",cpu="1",mode="idle"}'
        values: "0+1x20"
      - series: 'node_cpu_seconds_total{job="node",instance="n1",cpu="1",mode="user"}'
        values: "0+0x20"
      - series: 'node_filesystem_avail_bytes{job="node",instance="n1",device="/dev/sda",fstype="ext4",mountpoint="/a"}'
        values: "300x20"
      - series: 'node_filesystem_size_bytes{job="node",instance="n1",device="/dev/sda",fstype="ext4",mountpoint="/a"}'
        values: "1000x20"
      - series: 'node_filesystem_avail_bytes{job="node",instance="n1",device="/dev/sda",fstype="ext4",mountpoint="/b"}'
        values: "300x20"
      - series: 'node_filesystem_size_bytes{job="node",instance="n1",device="/dev/sda",fstype="ext4",mountpoint="/b"}'
        values: "1000x20"
    promql_expr_test:
      - expr: round(instance:node_cpu_utilisation:ratio, 0.01)
        eval_time: 5m
        exp_samples:
          - labels: '{instance="n1"}'
            value: 0.1
      # same device mounted twice -> one series
      - expr: instance:node_filesystem_utilisation:ratio
        eval_time: 1m
        exp_samples:
          - labels: 'instance:node_filesystem_utilisation:ratio{instance="n1",device="/dev/sda",fstype="ext4"}'
            value: 0.7

  - interval: 15s
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node",instance="n1"}'
        values: "250x10"
      - series: 'node_memory_MemTotal_bytes{job="node",instance="n1"}'
        values: "1000x10"
      - series: 'pg_stat_activity_count{job="postgres",datname="tasks",state="active"}'
        values: "5x10"
      - series: 'pg_stat_activity_count{job="postgres",datname="tasks",state="idle"}'
        values: "5x10"
      - series: 'pg_settings_max_connections{job="postgres"}'
        values: "50x10"
    promql_expr_test:
      - expr: instance:node_memory_utilisation:ratio
        eval_time: 1m
        exp_samples:
          - labels: 'instance:node_memory_utilisation:ratio{instance="n1",job="node"}'
            value: 0.75
      - expr: postgres:connections:ratio
        eval_time: 1m
        exp_samples:
          - labels: "postgres:connections:ratio"
            value: 0.2
